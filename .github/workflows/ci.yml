name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-age:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test dependency age policy
        run: python3 -m unittest discover -s scripts -p 'test_dependency_age.py'
      - name: Enforce dependency release age
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/dependency-age.py --base "$BASE_SHA"

  test:
    needs: dependency-age
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: zzira
          POSTGRES_PASSWORD: zzira
          POSTGRES_DB: zzira
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zzira"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Server build
        run: go build ./...
      - name: Wasm build gate (client)
        run: GOOS=js GOARCH=wasm go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      # CONTRIBUTING asks every change to pass golangci-lint; without it here
      # the findings built up unseen.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: Verify pinned Cloud API inventory
        run: |
          python3 -m unittest api/conformance/test_inventory.py api/conformance/test_coverage.py
          python3 api/conformance/inventory.py --check
          python3 api/conformance/coverage.py --check
          python3 api/conformance/app_scopes.py --check
          python3 api/conformance/anonymous_operations.py --check
      - name: Unit + integration tests
        env:
          TEST_DATABASE_URL: postgres://zzira:zzira@localhost:5433/zzira?sslmode=disable
        run: go test -count=1 ./...

  e2e:
    needs: dependency-age
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: zzira
          POSTGRES_PASSWORD: zzira
          POSTGRES_DB: zzira
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zzira"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - name: Build
        run: |
          go build -o bin/zzira-server ./cmd/server
          GOOS=js GOARCH=wasm go build -ldflags "-X github.com/e6qu/zzira/internal/build.Renderer=$(git rev-parse --short HEAD)" -o bin/zzira-worker.wasm ./cmd/client
          mkdir -p web/static/wasm
          cp bin/zzira-worker.wasm web/static/zzira-worker.wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/static/wasm/wasm_exec.js
      - name: Start server
        env:
          DATABASE_URL: postgres://zzira:zzira@localhost:5433/zzira?sslmode=disable
          WORKSPACE_SLUG: zzira
          ZZIRA_EXTERNAL_URL: http://localhost:8080
          ZZIRA_ALLOW_INSECURE_OIDC: "true"
          ZZIRA_ATLASSIAN_CLIENT_ID: e2e-atlassian-client
          ZZIRA_ATLASSIAN_CLIENT_SECRET: e2e-atlassian-secret
          ZZIRA_IDENTITY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          go run ./cmd/server -mode=migrate
          go run ./cmd/server -mode=seed
          nohup ./bin/zzira-server &
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-max-time 5 \
            http://127.0.0.1:8080/healthz
      - name: Run Playwright specs
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7

  # A deploy runs a new build's migrations and demo seed over a database an
  # earlier build wrote. The test job only ever starts from nothing, so this
  # one upgrades from the pull request's base: that build migrates and seeds
  # an empty database, and this one migrates it and seeds it twice.
  upgrade:
    needs: dependency-age
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: zzira
          POSTGRES_PASSWORD: zzira
          POSTGRES_DB: zzira
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zzira"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Upgrade from the base of this pull request
        env:
          DATABASE_URL: postgres://zzira:zzira@localhost:5433/zzira?sslmode=disable
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/upgrade-test.sh "$BASE_SHA"

  govulncheck:
    needs: dependency-age
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Dependency vulnerability scan (stdlib + modules)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  docker:
    needs: dependency-age
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build scratch image
        run: docker build -t zzira:${{ github.sha }} .
      - name: Trivy image scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zzira:${{ github.sha }}
          version: v0.75.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"

  npm-audit:
    needs: dependency-age
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - name: npm dependency audit
        working-directory: e2e
        env:
          # npm's defaults can spend seven minutes on a single unavailable
          # audit request. Keep each request bounded; the loop below retries
          # only registry/network failures, never vulnerability findings.
          npm_config_fetch_retries: "1"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "5000"
          npm_config_fetch_timeout: "30000"
        run: |
          npm ci --no-fund --no-audit

          audit_log="$(mktemp)"
          trap 'rm -f "$audit_log"' EXIT

          for attempt in 1 2 3; do
            if npm audit --audit-level=high 2>&1 | tee "$audit_log"; then
              exit 0
            fi

            if ! grep -Eqi 'audit endpoint returned an error|EAI_AGAIN|ECONN|ETIMEDOUT|429 Too Many Requests|50[0234] (Bad Gateway|Service Unavailable|Gateway Timeout)' "$audit_log"; then
              exit 1
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "npm audit registry request failed after $attempt attempts" >&2
              exit 1
            fi

            echo "npm audit registry request failed; retrying (attempt $((attempt + 1))/3)" >&2
            sleep "$((attempt * 5))"
          done

  gosec:
    needs: dependency-age
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gosec SAST (SARIF to Code Scanning)
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: -no-fail -fmt sarif -out gosec.sarif ./...
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: gosec.sarif
