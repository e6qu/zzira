name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zzira
          POSTGRES_PASSWORD: zzira
          POSTGRES_DB: zzira
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zzira"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Server build
        run: go build ./...
      - name: Wasm build gate (client)
        run: GOOS=js GOARCH=wasm go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit + integration tests
        env:
          TEST_DATABASE_URL: postgres://zzira:zzira@localhost:5433/zzira?sslmode=disable
        run: go test -count=1 ./...

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zzira
          POSTGRES_PASSWORD: zzira
          POSTGRES_DB: zzira
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zzira"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        run: |
          go build -o bin/zzira-server ./cmd/server
          GOOS=js GOARCH=wasm go build -ldflags "-X github.com/e6qu/zzira/internal/build.Renderer=$(git rev-parse --short HEAD)" -o bin/zzira-worker.wasm ./cmd/client
          cp bin/zzira-worker.wasm web/static/zzira-worker.wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/static/wasm/wasm_exec.js
      - name: Start server
        env:
          DATABASE_URL: postgres://zzira:zzira@localhost:5433/zzira?sslmode=disable
        run: |
          go run ./cmd/server -mode=migrate
          go run ./cmd/server -mode=seed
          nohup ./bin/zzira-server &
          sleep 2
      - name: Run Playwright specs
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Dependency vulnerability scan (stdlib + modules)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm dependency audit
        working-directory: e2e
        run: |
          npm install --no-fund --no-audit
          npm audit --audit-level=high

  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gosec SAST (SARIF to Code Scanning)
        uses: securego/gosec@master
        with:
          args: -no-fail -fmt sarif -out gosec.sarif ./...
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
