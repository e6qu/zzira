name: sast

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Enforce dependency release age
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/dependency-age.py --base "$BASE_SHA"
      # Semgrep comes from PyPI at the version the requirements file pins
      # rather than from its Docker Hub image, whose anonymous pull limit the
      # shared runners exhaust.
      - name: install semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --quiet --only-binary=:all: -r .github/uv-requirements.txt
          "$RUNNER_TEMP/semgrep/bin/uv" pip install --python "$RUNNER_TEMP/semgrep/bin/python" --exclude-newer "24 hours" -r .github/semgrep-requirements.txt
      - name: semgrep scan (security rulesets)
        run: '"$RUNNER_TEMP/semgrep/bin/semgrep" scan --config p/golang --config p/secrets --config p/xss --error --severity ERROR'
