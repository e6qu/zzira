name: sast

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: semgrep scan (security rulesets)
        run: semgrep scan --config p/golang --config p/secrets --config p/xss --error --severity ERROR
