name: codeql

on:
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # Vendored upstream sqlite3-wasm worker files are excluded from
          # analysis: their postMessage/redirect handlers are not executed in
          # ZZIRA (we drive sqlite3 directly via installOpfsSAHPoolVfs).
          paths-ignore: |
            web/static/sqlite
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
