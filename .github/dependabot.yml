version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
  # No `docker` entry: its anonymous lookups on public.ecr.aws for the
  # Dockerfile's base image exceed ECR Public's one-request-per-second limit and
  # fail with 429, and it applies no cooldown to that registry.
  # scripts/image-pins.py (the image-pins workflow) keeps those pins current.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    # A major upgrade needs a data migration for existing pgdata volumes.
    ignore:
      - dependency-name: docker/library/postgres
        update-types: ["version-update:semver-major"]
