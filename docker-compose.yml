services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: zzira
      POSTGRES_PASSWORD: zzira
      POSTGRES_DB: zzira
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zzira"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  zzira:
    build: .
    environment:
      DATABASE_URL: postgres://zzira:zzira@postgres:5432/zzira?sslmode=disable
      STATIC_DIR: /static
      DATA_DIR: /data
      BASE_URL: http://localhost:8080
      WORKSPACE_SLUG: zzira
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
