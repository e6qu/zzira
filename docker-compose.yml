services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: zzira
      POSTGRES_PASSWORD: zzira
      POSTGRES_DB: zzira
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zzira"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  zzira:
    build: .
    environment:
      DATABASE_URL: postgres://zzira:zzira@postgres:5432/zzira?sslmode=disable
      STATIC_DIR: /static
      DATA_DIR: /data
      BASE_URL: http://localhost:8080
      WORKSPACE_SLUG: zzira
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
