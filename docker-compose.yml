services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zzira
      POSTGRES_PASSWORD: zzira
      POSTGRES_DB: zzira
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zzira"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: bitnami/minio:latest
    environment:
      MINIO_ROOT_USER: zzira
      MINIO_ROOT_PASSWORD: zzirazzira
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/bitnami/minio/data

volumes:
  pgdata:
  miniodata:
