services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17.12-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_USER: zzira
      POSTGRES_PASSWORD: zzira
      POSTGRES_DB: zzira
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zzira"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  zzira:
    build: .
    environment:
      DATABASE_URL: postgres://zzira:zzira@postgres:5432/zzira?sslmode=disable
      STATIC_DIR: /static
      DATA_DIR: /data
      BASE_URL: http://localhost:8080
      WORKSPACE_SLUG: zzira
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
